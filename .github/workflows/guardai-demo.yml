name: GuardAI End-to-End Demo

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  clean-infrastructure-should-pass:
    name: Clean infrastructure passes
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GuardAI Scan
        id: scan
        uses: ./
        with:
          path: examples/demo-repo/passing
          fail-on: medium
          mock: 'true'

      - name: Show the action outputs
        run: |
          echo "passed=${{ steps.scan.outputs.passed }}"
          echo "findings-count=${{ steps.scan.outputs.findings-count }}"

  published-action-reference-works:
    name: Published action reference works
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GuardAI Scan via the published reference
        id: scan
        uses: GuardAI-Platform/GuardAIOps-CLI@main
        with:
          path: examples/demo-repo/passing
          fail-on: medium
          mock: 'true'

      - name: Confirm the action resolved and ran
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          if [ "$SCAN_EXIT_CODE" != "0" ]; then
            echo "Expected exit code 0 from the published action, got '$SCAN_EXIT_CODE'."
            exit 1
          fi
          echo "Customers can use: uses: GuardAI-Platform/GuardAIOps-CLI@main"

  insecure-infrastructure-should-fail:
    name: Insecure infrastructure is blocked
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GuardAI Scan
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: examples/demo-repo/failing
          fail-on: medium
          mock: 'true'

      - name: Verify the action reported violations and not a crash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          SCAN_FINDINGS: ${{ steps.scan.outputs.findings-count }}
        run: |
          echo "outcome=$SCAN_OUTCOME exit-code=$SCAN_EXIT_CODE findings=$SCAN_FINDINGS"

          if [ "$SCAN_OUTCOME" != "failure" ]; then
            echo "Expected the GuardAI step to fail on the insecure fixture."
            exit 1
          fi

          if [ "$SCAN_EXIT_CODE" != "1" ]; then
            echo "Expected exit code 1 (violations found) but got '$SCAN_EXIT_CODE'."
            echo "An empty value means the action never ran. Exit code 3 means GuardAI itself failed."
            exit 1
          fi

          if [ -z "$SCAN_FINDINGS" ] || [ "$SCAN_FINDINGS" -lt 1 ]; then
            echo "Expected at least one finding but got '$SCAN_FINDINGS'."
            exit 1
          fi

          echo "GuardAI correctly blocked the insecure infrastructure with $SCAN_FINDINGS findings."

      - name: Verify the CLI exit code directly
        run: |
          set +e
          node bin/guardai.js scan --mock --path examples/demo-repo/failing > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "Expected the CLI to exit 1 on the insecure fixture, got $code."
            exit 1
          fi
          echo "CLI exit code contract holds: 1 means violations found."
